openapi: 3.0.1
info:
  title: PEC Workflow and Campagin Initiation
  description: API interaction to generate new PEC campaign, then additional Endpoint to add people
  version: 0.1
servers:
  - url: https://xxx.production.gov.uk/v2
    description: Production environment
  - url: https://xxx.test.gov.uk/v2
    description: Testing and sandbox environment
paths:
  /campaign:
    post:
      tags:
        - Create New PEC Campagin
      summary: Endpoint for creating new campaigns in the PEC system
      description: Parse data to create new PEC campaign for campaign candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/newCampaign'
      responses:
        '201':
          description: Successfully created the PEC workflows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseCampaign'
        '400':
          description: Payload Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
/campaign/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
        description: The unique system identifier of the campaign.
    get:
      tags:
        - Campaign Details
      summary: Retrieve campaign summary details
      description: Returns a specific number and two descriptive strings associated with the requested campaign.
      responses:
        '200':
          description: Successfully retrieved the campaign details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSummary'
        '400':
          description: Payload Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Add Applicants to PEC Campagin
      summary: Endpoint for adding new Applicants to a PEC campaign
      description: Parse data to create new PEC workflows for campaign candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/newApplicants'
      responses:
        '201':
          description: Successfully created the PEC workflows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseApplicants'
        '400':
          description: Payload Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'  
/campaign/{campaignId}/{applicantId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
        description: The unique system identifier of the campaign.
      - name: applicantId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the applicant.
    get:
      tags:
        - Applicant Details
      summary: Retrieve applicant status
      description: Returns the current processing status of a specific applicant within a campaign.
      responses:
        '200':
          description: Successfully retrieved the applicant status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantStatusResponse'
        '400':
          description: Payload Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Applicant or Campaign Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      title: Error Response
      type: object
      properties:
        errorCode:
          title: Error Code
          type: integer
          description: The numeric error code to pass back to the consumer.
        title:
          title: Error Title
          type: string
          description: The title of the error.
        message:
          title: Error Message
          type: string
          description: A detailed description of the error.
        errorDetailArray:
          title: Error Detail Array
          type: array
          description: An array containing any extra details of the error, for example field names.
          items:
            type: string
      example:
        errorCode: 400
        title: "Validation Error"
        message: "The request payload failed schema validation."
        errorDetailArray:
          - "criminalRecordCheckLevel is required."
          - "jobLocations must contain at least 1 item."  
    SuccessResponseCampaign:
      title: Successful Integration Response
      type: object
      properties:
        message:
          title: Note
          type: string
          description: Status note regarding the request creation.
        requestingSystemCampaignbId:
          title: Requesting System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the requestors system
          example: asd4-45sd-w4344-wer3
        pECSystemCampaignbId:
          title: PEC System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the PEC system
          example: asd4-45sd-w4344-wer3
        businessCluster:
          title: Business Cluster
          type: string
          description: The name of the organizational cluster the request is coming from.
          example: Unity
        campaignPECStatus:
          title: Campagin Staus in PEC system
          type: string
          description: The status of the campaign in the PEC system
          example: active
    SuccessResponseApplicants:
      title: Successful Integration Response
      type: object
      properties:
        message:
          title: Note
          type: string
          description: Status note regarding the request creation.
        requestingSystemCampaignbId:
          title: Requesting System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the requestors system
          example: asd4-45sd-w4344-wer3
        pECSystemCampaignbId:
          title: PEC System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the PEC system
          example: asd4-45sd-w4344-wer3
        businessCluster:
          title: Business Cluster
          type: string
          description: The name of the organizational cluster the request is coming from.
          example: Unity
        campaignPECStatus:
          title: Campagin Staus in PEC system
          type: string
          description: The status of the campaign in the PEC system
          example: active
        workflowConfirmations:
          title: PEC Workflow Confirmations
          type: array
          description: The statuses and identifiers of the newly created PEC workflows.
          items:
            $ref: '#/components/schemas/WorkflowConfirmation'
    newCampaign:
      title: New Campagin Object
      type: object
      description: The object to be used to create a new campaign in the PEC system
      required:
        - campaignId
        - businessCluster
        - employingDepartment
        - requestingSystemCampaignbId
        - jobTitle
        - jobLocations
        - caseManagers
      properties:
        campaignId:
          title: Campaign ID
          type: string
          description: The human readable unique identifier of the recruitment campaign.
          example: CMP12345
        businessCluster:
          title: Business Cluster
          type: string
          description: The name of the organizational cluster the request is coming from.
          example: Unity
        employingDepartment:
          title: Employing Department
          type: string
          description: The name of the department the position is with.
          example: HMRC
        requestingSystemCampaignbId:
          title: Requesting System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the requestors system
          example: asd4-45sd-w4344-wer3
        caseManagers:
          title: Case Managers
          type: array
          description: A list of business contacts responsible for managing these active checking cases.
          minItems: 1
          items:
            $ref: '#/components/schemas/CaseManager'
        campaignTemplate:
          title: Campagin Template
          description: An id supplied by the requesting system to tell the PEC service which checks are to be performed
          type: string
          example: SEO-SC-1
        specificCheckOverrides:
          title: Specific Check Overrides (Optional)
          type: array
          description: Optional. Specific check requirements to bypass general departmental policies if explicitly needed for this applicant.
          items:
            $ref: '#/components/schemas/CheckOverride'
    CaseManager:
      title: Case Manager
      type: object
      description: The contact details of a person managing these active checking cases.
      required:
        - name
        - email
      properties:
        name:
          title: Name
          type: string
          example: Jane Doe
        email:
          title: Email
          type: string
          format: email
          example: jane.doe@gov.uk
        phoneNumber:
          title: Phone Number
          type: string
          example: "+44 7700 900077"
    newApplicants:
      title: New Applicants Object
      description: A object housing new applicants to be added to an existing campaign in the PEC system. A new wortk flow will be generated for each applicant
      type: object
      required:
        - requestingSystemCampaignbId
        - pECSystemCampaignbId
        - applicants
      properties:
        requestingSystemCampaignbId:
          title: Requesting System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the requestors system
          example: asd4-45sd-w4344-wer3
        pECSystemCampaignbId:
          title: PEC System Unique Campagin ID
          type: string
          description: The unique system identifier of the campaign in the PEC system
          example: asd4-45sd-w4344-wer3
        applicants:
          title: Applicants
          type: array
          description: An array of applicants requiring pre-employment checks.
          items:
            $ref: '#/components/schemas/Applicant'
    Applicant:
      title: Applicant Object
      description: An object representing a single applicant to be processed by the PEC system
      type: object
      required:
        - firstName
        - lastName
        - email
        - clientApplicantId
      properties:
        firstName:
          title: First Name
          type: string
          example: Robert
        lastName: 
          title: Last Name
          type: string
          example: Builder
        email:
          title: Email Address
          type: string
          format: email
          example: bob@builder.com
        telephoneNumber:
          title: Telephone Number
          type: string
          description: The applicant's contact telephone number.
          example: "+44 7700 900123"
        dateOfBirth:
          title: Date of Birth 
          type: string
          format: date
          example: 2017-07-21
        clientApplicantId:
          title: Client Applicant ID
          type: string
          description: The unique ID assigned by the consuming source system to identify this applicant.
          example: APP-88291
    WorkflowConfirmation:
      title: Workflow Confirmation Response
      type: object
      properties:
        clientApplicantId:
          title: Client Applicant ID
          type: string
          description: The unique ID assigned by the consuming source system.
          example: APP-88291
        pECApplicantId:
          title: Provider Applicant ID
          type: string
          description: The unique identifier generated by the service provider for this candidate.
          example: PEC-12345
        workflowStatus:
          title: Workflow Status
          type: string
          description: The current status of the created PEC workflow.
          example: Pending
    CheckOverride:
      title: Check Override
      type: object
      properties:
        checkType:
          title: Check Type
          type: string
          description: The explicit type of the check required.
          example: UKSV
        checkLevel:
          title: Check Level
          type: string
          description: Used to send a specific modifier or level for the check.
          example: DV
    CampaignSummary:
      title: Campaign Summary
      description: An object containing two strings and one number representing high-level campaign details.
      type: object
      properties:
        campaignStatus:
          title: Campaign Status
          type: string
          description: The current status of the campaign.
          example: "Active"
        campaignOwner:
          title: Campaign Owner
          type: string
          description: The department or cluster that owns the campaign.
          example: "HMRC"
        applicantCount:
          title: Applicant Count
          type: integer
          description: The total number of applicants currently in the campaign.
          example: 42
    ApplicantStatusResponse:
      title: Applicant Status Response
      description: An object representing the current status of an applicant's pre-employment checks.
      type: object
      properties:
        applicantId:
          title: Applicant ID
          type: string
          description: The unique identifier of the applicant.
          example: PEC-12345
        status:
          title: Workflow Status
          type: string
          description: The current status of the applicant's workflow in the PEC system.
          example: Pending
        lastUpdated:
          title: Last Updated Date
          type: string
          format: date-time
          description: The timestamp when the status was last updated.
          example: "2026-09-30T10:15:30Z"
