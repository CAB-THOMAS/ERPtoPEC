<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My APIs</title>
    <!-- Load modern Swagger UI version 5 stylesheet -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      html {
        box-sizing: border-box;
        overflow-y: scroll;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
        font-family: sans-serif;
      }
      /* Custom styles for our top bar and buttons */
      .api-selector-bar {
        background-color: #1b1b1b;
        padding: 15px;
        text-align: center;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .api-selector-bar button {
        background-color: #89bf04;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.2s;
      }
      .api-selector-bar button:hover {
        background-color: #72a103;
      }
    </style>
  </head>
  <body>
    <!-- Top Bar with Buttons -->
    <div class="api-selector-bar">
      <!-- Change the string inside loadAPI() to match your YAML/JSON file paths -->
      <button onclick="loadAPI('PECRequest.yaml')">Load Batch PEC API</button>
      <button onclick="loadAPI('PECRequest2.yaml')">Load Second API</button>
    </div>

    <div id="swagger-ui"></div>

    <!-- Load Swagger UI bundle and standalone preset scripts -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>

    <script>
      // Wrap the Swagger UI initialization in a reusable function
      function loadAPI(apiUrl) {
        window.ui = SwaggerUIBundle({
          url: apiUrl,
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout"
        });
      }

      // Load the default API on initial page load
      window.onload = function () {
        loadAPI("BatchPECRequest.yaml");
      };
    </script>
  </body>
</html>
