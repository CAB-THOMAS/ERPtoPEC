openapi: 3.0.1
info:
  title: Individual PEC request
  description: API interation to generate a single new PEC workflow for an applicant
  version: v0.1
servers:
- url: "{server}/xx/v2"
  description: default server
  variables:
    server:
      default: https://xxxx.x.xxx
paths:
  "/PEC":
    post:
      tags:
        - Individual PEC Workflow Request
      summary: Endpoint for creating new PEC workflow
      description: Parse data to create a new PEC workflow.
      requestBody:
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/PECRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulIntergrationResponce'
        '400':
          description: Payload Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnseccessfulIntergrationResponce'
        '401':
          description: Authentication Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnseccessfulIntergrationResponce'
        '409':
          description: Idempotency Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnseccessfulIntergrationResponce'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnseccessfulIntergrationResponce'
components:
  schemas:
    UnseccessfulIntergrationResponce:
      title: Unsuccessful response to Vacancy data
      type: object
      properties:
        ErrorCode:
          title: Error Code
          type: integer
          description: the numeric error to pass back to the user
        Title:
          title: Error title
          description: the title of the error
          type: string
        Message:
          title: Error description
          type: string
          description: A description of the error
        ErrorDetailArray:
          title: Error Detail Array
          description: >-
            An array containing any extra details of the error, for example
            field names.
          type: array
          items:
            type: string
      description: An object containing the details of unsuccessful integration and error message.
    SuccessfulIntergrationResponce:
      title: Successful response to Vacancy data
      type: object
      properties:
        Message:
          title: Note
          type: string
          description: note
        PECWorkflowID:
          title: PEC Workflow ID
          description: The unique ID created by the PEC workflow for this new case
          type: string
        UniqueERPRequestID:
          title: Unique ERP Request ID
          description: The unique id created by the ERP system to identify this request.
          type: string
        PECStatus:
          title: PEC Status
          description: The status of the newly created PEC workflow 
          type: string
      description: Successful response message
    PECRequest:
      title: PEC Request Object
      type: object
      properties:
        CampaginID:
          title: Campagin ID
          description: The ID of the campaign
          type: string
          example: CMP12345
        Cluster:
          title: Cluster
          description: The name of the cluster the request id coming from
          type: string
          example: Unity
        Department:
          title: Department
          description: The name of the department the position is with
          type: string
          example: HMRC
        FirstName:
          title: First name
          description: The applicants first name
          type: string
          example: Robert
        LastName: 
          title: Last name
          description: The applicants last name
          type: string
          example: Builder
        PreferedName:
          title: Prefered name
          description: The applicants prefered name
          type: string
          example: Bob
        Email:
          title: Email Address
          description: Email Address of applicant
          type: string
          example: bob@builder.com
        DateOfBirth:
          title: Date of Birth 
          description: The applicants date of birth
          type: string
          format: date
          example: 2017-07-21
        JobTitle:
          title: Job Title
          description: The title of the role the applicant is being PECed for
          type: string
          example: Site Manager
        JobLocation:
          title: Job Location
          description: The Location where the applicant will work.
          type: string
          example: England
        UniqueERPRequestID:
          title: Unique ERP Request ID
          description: The unique id created by the ERP system to identify this request.
          type: string
          example: ERP12345
        CheckTemplateName:
          title: Check Template Name
          description: The name the check workflow template to be used
          type: string
        CheckTemplateGUID:
          title: Check Template GUID
          description: The GUID the check workflow template to be used
          type: string
          format: uuid
        Checks:
          title: Checks
          description: An array of additional checks or check modifers
          type: array
          items:
            - "$ref": "#/components/schemas/CheckRequired"
    CheckRequired:
      title: Check CheckRequired
      description: an object repersenting a specifc check request
      type: object
      properties:
        CheckName:
          title: Check Name
          description: The name of the check required
          type: string
          example: UKSV
        CheckModifer:
          title: Check Modifer
          description: Used to send a modifer of the check or level
          type: string
          example: DV



