openapi: 3.1.0
info:
  title: PEC Initiate Checks
  description: API interaction to generate new PEC campaigns and add applicants.
  version: 1.2.0
  contact:
    name: API Support Team
    email: api-support@production.gov.uk
servers:
  - url: https://xxx.production.gov.uk/v2
    description: Production environment
  - url: https://xxx.test.gov.uk/v2
    description: Testing and sandbox environment

security:
  - OAuth2: 
      - pec:write

paths:
  /campaign:
    post:
      tags:
        - Campaigns
      summary: Create a new PEC campaign
      description: Initialize a new pre-employment check (PEC) campaign. Must be supplied with an Idempotency-Key for safe retries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/NewCampaign'
      responses:
        '201':
          description: Successfully created the PEC campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseCampaign'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict / Idempotency Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /campaign/{pecSystemCampaignId}/applicants:
    post:
      tags:
        - Applicants
      summary: Add new Applicants to a PEC campaign
      description: Creates new PEC workflows for campaign candidates.
      parameters:
        - name: pecSystemCampaignId
          in: path
          required: true
          description: The unique system identifier of the campaign.
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/NewApplicants'
      responses:
        '201':
          description: Successfully created the PEC workflows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseApplicants'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict / Applicant already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Modern OAuth2 Client Credentials flow for system-to-system authentication.
      flows:
        clientCredentials:
          tokenUrl: https://auth.production.gov.uk/oauth/token
          scopes:
            pec:write: Grants permission to submit PEC requests

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique client-generated string (e.g., a UUID) to prevent duplicate operations on network retries.
      schema:
        type: string
        format: uuid

  schemas:
    ProblemDetails:
      title: Problem Details (RFC 7807)
      type: object
      description: A machine-readable format for specifying errors in HTTP API responses.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          default: "about:blank"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
        errors:
          type: array
          description: Specific validation errors (e.g., failed field rules).
          items:
            type: string
      examples:
        - type: "https://example.gov.uk/probs/validation-error"
          title: "Validation Error"
          status: 400
          detail: "The request payload failed schema validation."
          errors:
            - "nsvRequirement.level is required when isNsvRequired is true."

    SuccessResponseCampaign:
      title: Campaign Successfully created
      type: object
      properties:
        consumerSystemCampaignId:
          type: string
          description: The unique system identifier of the campaign in the requestors system.
        pecSystemCampaignId:
          type: string
          description: The unique system identifier of the campaign in the PEC system.
        message:
          type: string
          description: Status note regarding the request creation.
        ssfgCluster:
          type: string
          description: The name of the organizational cluster the request is coming from.
        campaignPECStatus:
          type: string
          description: The status of the campaign in the PEC system.
      examples:
        - consumerSystemCampaignId: req-1234-abcd
          pecSystemCampaignId: pec-9876-wxyz
          message: "Campaign initialized successfully"
          ssfgCluster: Unity
          campaignPECStatus: active

    SuccessResponseApplicants:
      title: Applicants Successfully created
      type: object
      properties:
        consumerSystemCampaignId:
          type: string
        pecSystemCampaignId:
          type: string
        message:
          type: string
        ssfgCluster:
          type: string
        campaignPECStatus:
          type: string
        workflowConfirmations:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConfirmation'
            
    NewCampaign:
      title: New Campaign Object
      type: object
      required:
        - consumerCampaignId
        - consumerSystemCampaignId
        - ssfgCluster
        - employingDepartment
        - title
        - csrfApproach
        - crcRequirement
        - nsvRequirement
        - requestOwners
      properties:
        consumerCampaignId:
          type: string
          maxLength: 100
        consumerSystemCampaignId:
          type: string
          maxLength: 100
        ssfgCluster:
          type: string
          enum: [Defense, Matrix, Non-Clustered, Overseas, Synergy, Unity]
        employingDepartment:
          type: string
          enum: [Ministry of Defence, Home Office, HM Revenue and Customs, Department for Work and Pensions, Cabinet Office, "Foreign, Commonwealth & Development Office"]
        title:
          type: string
          maxLength: 255 
        csrfApproach:
          type: string
          enum: [Internal, Across Government, External, None]
        crcRequirement:
          $ref: '#/components/schemas/CRCRequirement'
        nsvRequirement:
          $ref: '#/components/schemas/NSVRequirement'
        requestOwners:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestOwner'
        specificCheckOverrides:
          type: object
          properties:
            Internal:
              type: array
              items: { $ref: '#/components/schemas/CheckTypeEnum' }
            External:
              type: array
              items: { $ref: '#/components/schemas/CheckTypeEnum' }
            Other Government Department:
              type: array
              items: { $ref: '#/components/schemas/CheckTypeEnum' }
            Non-Departmental Public Body:
              type: array
              items: { $ref: '#/components/schemas/CheckTypeEnum' }
      examples:
        - consumerCampaignId: CMP12345
          consumerSystemCampaignId: req-1234-abcd
          ssfgCluster: Unity
          employingDepartment: Ministry of Defence
          title: "Senior Developer Recruitment"
          csrfApproach: External
          crcRequirement:
            isCrcRequired: true
            jurisdiction: Both
            scotlandCrcType: PVG
            otherJurisdictionCrcLevel: Enhanced
          nsvRequirement:
            isNsvRequired: true
            level: SC
          requestOwners:
            - name: Jane Doe
              email: jane.doe@gov.uk
              phoneNumber: "+44 7700 900077"

    CRCRequirement:
      title: CRC Requirement
      description: Dynamic schema that requires specific fields based on jurisdiction choices.
      type: object
      required:
        - isCrcRequired
      properties:
        isCrcRequired:
          type: boolean
          description: Set to true if a CRC is required.
        jurisdiction:
          type: string
          enum: ["Scotland Only", "Other Jurisdiction Only", "Both"]
        scotlandCrcType:
          type: string
          enum: ["Level 1", "Level 2", "Level 2 with barred list", "PVG"]
        otherJurisdictionCrcLevel:
          type: string
          enum: ["Basic", "Standard", "Enhanced", "Enhanced with barred list"]
      allOf:
        - if:
            properties:
              isCrcRequired:
                const: true
          then:
            required: [jurisdiction]
        - if:
            properties:
              jurisdiction:
                enum: ["Scotland Only", "Both"]
          then:
            required: [scotlandCrcType]
        - if:
            properties:
              jurisdiction:
                enum: ["Other Jurisdiction Only", "Both"]
          then:
            required: [otherJurisdictionCrcLevel]

    NSVRequirement:
      title: NSV Requirement
      description: Defines whether National Security Vetting is required, and the corresponding level.
      type: object
      required:
        - isNsvRequired
      properties:
        isNsvRequired:
          type: boolean
          description: Set to true if a National Security Vetting check is required.
        level:
          type: string
          description: The level of vetting record check required.
          enum: [AC, CTC, SC, eSC, DV, eDV]
      allOf:
        - if:
            properties:
              isNsvRequired:
                const: true
          then:
            required: [level]

    RequestOwner:
      title: Request Owner
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        phoneNumber:
          type: string
          minLength: 10
          maxLength: 16
      examples:
        - name: Jane Doe
          email: jane.doe@gov.uk
          phoneNumber: "+44 7700 900077"

    NewApplicants:
      title: New Applicants Object
      type: object
      required:
        - consumerSystemCampaignId
        - pecSystemCampaignId
        - applicants
      properties:
        consumerSystemCampaignId:
          type: string
        pecSystemCampaignId:
          type: string
        applicants:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Applicant'

    Applicant:
      title: Applicant Object
      type: object
      required: [consumerApplicantId, firstName, lastName, email]
      properties:
        consumerApplicantId:
          type: string
        firstName:
          type: string
        lastName: 
          type: string
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        telephoneNumber:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$' 
          minLength: 10
          maxLength: 16
        dateOfBirth:
          type: string
          pattern: '^\d{2}-\d{2}-\d{4}$'
          minLength: 10
          maxLength: 10
        nino:
          type: string
          pattern: '^[A-CEGHJ-PR-TW-Z]{1}[A-CEGHJ-NPR-TW-Z]{1} \d{2} \d{2} \d{2} [A-D]{1}$' 
          minLength: 13
          maxLength: 13
        crcLocation:
          type: string
          enum: [England, Wales, Scotland, Northern Ireland]
        applicantType:
          type: string
          enum: [Internal, External, Other Government Department, Non-Departmental Public Body]

    WorkflowConfirmation:
      title: Workflow Confirmation Response
      type: object
      properties:
        consumerApplicantId:
          type: string
        pecApplicantId:
          type: string
        workflowStatus:
          type: string

    CheckTypeEnum:
      title: Check Type
      type: string
      enum:
        - Employment History
        - Criminal Record Check
        - Right to work
        - Social Media
        - Internal Fraud
        - Overseas
